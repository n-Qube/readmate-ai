name: release-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: readmate_ci
          # Disposable runner-local database only; never used for production.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d readmate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://readmate_api@127.0.0.1:5432/readmate_ci
      READMATE_PG_TEST_URL: postgresql://readmate_api@127.0.0.1:5432/readmate_ci
      READMATE_PG_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/readmate_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:publication
      - run: npm run check:dependencies
      - name: Prepare disposable PostgreSQL regression database
        run: |
          psql "$READMATE_PG_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE readmate_api LOGIN NOSUPERUSER NOBYPASSRLS;
          CREATE SCHEMA storage;
          CREATE TABLE storage.buckets (
            id text PRIMARY KEY, name text, public boolean,
            file_size_limit bigint, allowed_mime_types text[]
          );
          SQL
          DATABASE_URL="$READMATE_PG_ADMIN_URL" npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx prisma validate --schema apps/api/prisma/schema.prisma
      - name: Validate production Expo configuration
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          READMATE_RELEASE_BUILD: "1"
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuZXhhbXBsZS5pbnZhbGlkJA
          EXPO_PUBLIC_READMATE_API_URL: https://api.example.invalid
          EXPO_PUBLIC_REVENUECAT_APPLE_API_KEY: appl_ci_public_sdk_key_123456789
          EXPO_PUBLIC_REVENUECAT_GOOGLE_API_KEY: goog_ci_public_sdk_key_123456789
        run: npx expo config --type public --json > /dev/null
      - name: Validate production Expo web export
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          WEB_APP_ORIGIN: https://app.example.invalid
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuZXhhbXBsZS5pbnZhbGlkJA
          EXPO_PUBLIC_READMATE_API_URL: https://api.example.invalid
        run: npm run export:web:firebase
      - name: Exercise Firebase Hosting HTTP contract
        working-directory: apps/mobile
        run: npx --yes --package=firebase-tools@15.4.0 -- node scripts/firebase-hosting-emulator.cjs
      - name: Validate extension release configuration
        env:
          READMATE_RELEASE_BUILD: "1"
          VITE_CLERK_PUBLISHABLE_KEY: pk_live_ci_placeholder
          VITE_CLERK_SYNC_HOST: https://clerk.example.invalid
          VITE_READMATE_API_URL: https://api.example.invalid
          VITE_ENABLE_CLERK_UI: "true"
        run: npm run build --workspace @readmate/extension
